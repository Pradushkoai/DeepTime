<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepTime 3D — Real-Time</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#0d1117;color:#e0e0e0;overflow:hidden;}
canvas#canvas3d{position:fixed;top:0;left:0;z-index:0;}
.overlay{position:fixed;z-index:10;pointer-events:none;}
.overlay *{pointer-events:auto;}

/* Top bar */
.topBar{top:0;left:0;right:0;padding:8px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(13,17,23,0.92),rgba(13,17,23,0.3));}
.topBar button{background:#f5a623;color:#0d1117;border:none;padding:6px 12px;border-radius:5px;cursor:pointer;
  font-weight:bold;font-size:12px;transition:all 0.2s;}
.topBar button:hover{background:#ffb84d;}
.topBar button.sec{background:#238636;color:#fff;}
.topBar button.sec:hover{background:#2ea043;}
.topBar button.dng{background:#da3633;color:#fff;}
.topBar button.sm{padding:4px 8px;font-size:11px;}
.topBar select,.topBar input{background:#0d1117;color:#e0e0e0;border:1px solid #30363d;padding:3px 5px;
  border-radius:4px;font-size:11px;}
.topBar .spacer{flex:1;}
.seasonInfo{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:bold;text-shadow:0 0 8px #000;}
.seasonInfo span{color:#f5a623;}

/* Season progress bar */
.seasonProgress{height:3px;background:#21262d;width:100%;position:fixed;top:0;left:0;z-index:11;}
.seasonProgress .fill{height:100%;background:linear-gradient(90deg,#3fb950,#d29922,#569cd6);transition:width 0.3s;}

/* Left panel */
.leftPanel{top:50px;left:8px;width:230px;max-height:92vh;overflow-y:auto;}
.panel{background:rgba(22,27,34,0.92);border:1px solid #30363d;border-radius:7px;padding:9px;margin-bottom:8px;}
.panelTitle{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;
  border-bottom:1px solid #21262d;padding-bottom:3px;}
.row{display:flex;justify-content:space-between;padding:2px 0;font-size:12px;}
.row .lbl{color:#8b949e;}
.row .val{font-weight:bold;}
.val.good{color:#3fb950;}.val.warn{color:#d29922;}.val.bad{color:#f85149;}
.bar{height:7px;background:#21262d;border-radius:3px;overflow:hidden;margin-top:2px;}
.barFill{height:100%;border-radius:3px;transition:width 0.3s;}
.barFill.press{background:linear-gradient(90deg,#3fb950 0%,#d29922 60%,#f85149 100%);}
.barFill.griev{background:linear-gradient(90deg,#3fb950 0%,#d29922 60%,#f85149 100%);}
.resGrid{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
.resCard{background:#21262d;padding:4px 7px;border-radius:4px;font-size:11px;}
.resCard b{color:#f5a623;}
.actTags{display:flex;flex-wrap:wrap;gap:2px;}
.actTag{padding:1px 5px;border-radius:3px;font-size:9px;font-weight:bold;}

/* Priority sliders */
.priRow{margin:4px 0;}
.priRow label{font-size:11px;color:#8b949e;display:flex;justify-content:space-between;}
.priRow input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#21262d;border-radius:2px;outline:none;}
.priRow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#f5a623;cursor:pointer;}

/* Right panel */
.rightPanel{top:50px;right:8px;width:240px;max-height:92vh;overflow-y:auto;}
.fac{background:#1c2128;border-radius:4px;padding:5px;margin-bottom:4px;}
.facN{font-weight:bold;font-size:11px;}
.facP{color:#8b949e;font-size:10px;}
.facG{font-size:9px;color:#8b949e;margin:1px 0;}
.logBox{background:#0d1117;border-radius:4px;padding:5px;max-height:140px;overflow-y:auto;
  font-size:10px;font-family:Consolas,monospace;}
.chEntry{padding:1px 0;border-bottom:1px solid #161b22;color:#8b949e;}
.chY{color:#f5a623;}

/* Event popup */
.eventPopup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;
  background:#1c2128;border:2px solid;border-radius:10px;padding:20px;max-width:400px;
  box-shadow:0 0 30px rgba(0,0,0,0.8);pointer-events:auto;}
.eventPopup.critical{border-color:#f85149;background:#2a1a1a;}
.eventPopup.high{border-color:#f5a623;}
.eventPopup.normal{border-color:#3fb950;}
.eventPopup.low{border-color:#555;}
.evTitle{font-size:16px;font-weight:bold;margin-bottom:8px;color:#f5a623;}
.eventPopup.critical .evTitle{color:#f85149;}
.evText{font-size:13px;color:#c9d1d9;margin-bottom:10px;}
.evTimer{font-size:10px;color:#8b949e;margin-bottom:10px;}
.evChoices{display:flex;flex-direction:column;gap:6px;}
.evChoice{background:#21262d;border:1px solid #30363d;border-radius:5px;padding:8px 12px;cursor:pointer;
  color:#e0e0e0;font-size:12px;text-align:left;transition:all 0.2s;}
.evChoice:hover{background:#30363d;border-color:#f5a623;}
.evChoice b{color:#3fb950;display:block;margin-bottom:2px;}
.evChoice small{color:#8b949e;}

/* Game over */
.gameOver{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:200;
  background:#2a1a1a;border:3px solid #f85149;border-radius:10px;padding:35px;text-align:center;}
.gameOver h2{color:#f85149;font-size:26px;margin-bottom:8px;}
.gameOver p{color:#8a7a6a;}

/* Tech panel */
.techItem{margin:4px 0;padding:4px 6px;border-radius:4px;font-size:11px;}
.techItem.unlocked{background:#1a3a1a;border:1px solid #3fb950;}
.techItem.locked{background:#1c2128;border:1px solid #30363d;}
.techItem .techName{font-weight:bold;}
.techItem.unlocked .techName{color:#3fb950;}
.techItem.locked .techName{color:#8b949e;}
.techItem .techDesc{font-size:9px;color:#8b949e;margin:1px 0;}
.techBar{height:4px;background:#21262d;border-radius:2px;margin-top:2px;overflow:hidden;}
.techBarFill{height:100%;background:#f5a623;border-radius:2px;transition:width 0.3s;}
.techItem.unlocked .techBarFill{background:#3fb950;}

/* Tech notification popup */
.techNotif{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:90;
  background:#1a3a1a;border:2px solid #3fb950;border-radius:10px;padding:15px 25px;
  text-align:center;box-shadow:0 0 20px rgba(63,185,80,0.3);pointer-events:auto;max-width:350px;}
.techNotif .tnIcon{font-size:24px;}
.techNotif .tnTitle{font-size:16px;font-weight:bold;color:#3fb950;margin:5px 0;}
.techNotif .tnDesc{font-size:12px;color:#8b949e;}
.techNotif .tnBtn{margin-top:8px;background:#3fb950;color:#0d1117;border:none;padding:5px 15px;
  border-radius:5px;cursor:pointer;font-weight:bold;font-size:12px;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0d1117;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px;}
</style>
</head>
<body>

<canvas id="canvas3d"></canvas>

<!-- Season progress bar -->
<div class="seasonProgress"><div class="fill" id="seasonBar" style="width:0%"></div></div>

<!-- Top bar -->
<div class="overlay topBar">
  <button class="sm" id="btnPause" onclick="togglePause()">⏸ Пауза</button>
  <button class="sm sec" id="btn1x" onclick="setSpeed(1)">1×</button>
  <button class="sm sec" id="btn2x" onclick="setSpeed(2)">2×</button>
  <button class="sm sec" id="btn3x" onclick="setSpeed(3)">3×</button>
  <div class="seasonInfo">
    <span id="seasonLabel">☀️ ЛЕТО</span>
    <span id="yearLabel">-10000</span>
    <span id="turnLabel">Ход 0</span>
    <span id="popLabel">👥 50</span>
    <span id="hungryLabel" style="color:#f85149;display:none;">🍗 0</span>
  </div>
  <div class="spacer"></div>
  <select id="selArch"><option>FOREST</option><option>STEPPE</option><option>RIVER_VALLEY</option>
  <option>COASTAL</option><option>MOUNTAIN</option><option>DESERT</option><option>TROPICAL</option>
  <option>ARCTIC</option></select>
  <input id="inpSeed" type="number" value="42" style="width:45px;">
  <input id="inpPop" type="number" value="50" style="width:45px;">
  <button class="dng sm" onclick="resetGame()">🔄 Новая</button>
</div>

<!-- Left panel -->
<div class="overlay leftPanel">
  <div class="panel">
    <div class="panelTitle">👑 Вождь</div>
    <div class="row"><span class="lbl">Имя</span><span class="val" id="chiefName">—</span></div>
    <div class="row"><span class="lbl">Возраст/Эра</span><span class="val" id="chiefAge">—</span></div>
    <div class="row"><span class="lbl">Легитимность</span><span class="val" id="chiefLegit">—</span></div>
    <div class="row"><span class="lbl">Давление</span><span class="val" id="chiefPress">—</span></div>
    <div class="bar"><div class="barFill press" id="pressBar" style="width:0%"></div></div>
    <div class="row" style="margin-top:3px;"><span class="lbl">Реформ</span><span class="val good" id="chiefReforms">0</span></div>
  </div>
  <div class="panel">
    <div class="panelTitle">📦 Запасы</div>
    <div class="resGrid">
      <div class="resCard">🥩 <b id="resMeat">0</b></div>
      <div class="resCard">🍓 <b id="resBerries">0</b></div>
      <div class="resCard">🐟 <b id="resFish">0</b></div>
      <div class="resCard">🪵 <b id="resWood">0</b></div>
    </div>
  </div>
  <div class="panel">
    <div class="panelTitle">⚙️ Приоритеты</div>
    <div class="priRow"><label>🍖 Еда <span id="vFood">40</span></label><input type="range" id="priFood" min="0" max="100" value="40" oninput="setPriority('food',this.value);document.getElementById('vFood').textContent=this.value"></div>
    <div class="priRow"><label>📦 Запасы <span id="vStock">30</span></label><input type="range" id="priStock" min="0" max="100" value="30" oninput="setPriority('stockpile',this.value);document.getElementById('vStock').textContent=this.value"></div>
    <div class="priRow"><label>🏗️ Стройка <span id="vBuild">10</span></label><input type="range" id="priBuild" min="0" max="100" value="10" oninput="setPriority('build',this.value);document.getElementById('vBuild').textContent=this.value"></div>
  </div>
  <div class="panel">
    <div class="panelTitle">👥 Действия</div>
    <div class="actTags" id="actTags"></div>
  </div>
  <div class="panel">
    <div class="panelTitle">🔬 Технологии</div>
    <div id="techList"></div>
  </div>
</div>

<!-- Right panel -->
<div class="overlay rightPanel">
  <div class="panel">
    <div class="panelTitle">⚔️ Фракции</div>
    <div id="factions"></div>
  </div>
  <div class="panel">
    <div class="panelTitle">📖 Хроника</div>
    <div class="logBox" id="chronicle"></div>
  </div>
  <div class="panel">
    <div class="panelTitle">📜 Решения</div>
    <div class="logBox" id="recentDec"></div>
  </div>
  <div class="panel">
    <div class="panelTitle">📊 Метрики</div>
    <div class="row"><span class="lbl">Событий</span><span class="val" id="mEvents">0</span></div>
    <div class="row"><span class="lbl">Решений</span><span class="val" id="mDecisions">0</span></div>
    <div class="row"><span class="lbl">Зим</span><span class="val" id="mWinters">0</span></div>
    <div class="row"><span class="lbl">Макс.давл.</span><span class="val" id="mPressure">0</span></div>
  </div>
</div>

<!-- Event popup -->
<div class="eventPopup" id="eventPopup"></div>

<!-- Tech notification popup -->
<div class="techNotif" id="techNotif" style="display:none;" data-tech-id=""></div>

<!-- Game over -->
<div class="gameOver" id="gameOver">
  <h2>💀 Племя погибло</h2>
  <p>Зим: <span id="goWinters">0</span> | Год: <span id="goYear">0</span></p>
  <br><button class="dng" onclick="resetGame()">Начать заново</button>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- Game -->
<script src="sim.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>

<script>start();</script>
</body>
</html>
